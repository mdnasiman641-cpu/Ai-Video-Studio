[project]
name = "ai-video-studio"
version = "0.3.1"
description = "Windows desktop video editor with captions, face tracking, smart cuts and batch export"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
faulthandler_timeout = 120
filterwarnings = ["ignore::DeprecationWarning:shiboken6.*"]
