name: Whisper diagnostics

# Manual only. 1) How real faster-whisper models (tiny, small, medium) transcribe the synthetic
# English/Bengali fixtures. 2) Character error rate on real human Bengali speech (Google FLEURS,
# CC-BY-4.0, fetched at run time).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Cache Whisper models
        uses: actions/cache@v4
        with:
          path: .cache/whisper-diag
          key: whisper-diag-tiny-small-medium-v1
      - name: Download models
        run: |
          for m in tiny small medium; do
            python -c "from huggingface_hub import snapshot_download as d; d('Systran/faster-whisper-$m', local_dir='.cache/whisper-diag/$m')"
          done
      - name: Probe
        run: python scripts/diagnostics/whisper_probe.py .cache/whisper-diag/tiny .cache/whisper-diag/small .cache/whisper-diag/medium
      - name: Real Bengali speech (FLEURS bn_in) character error rate
        continue-on-error: true
        run: python scripts/diagnostics/fleurs_bengali_probe.py 5 .cache/whisper-diag/small .cache/whisper-diag/medium
