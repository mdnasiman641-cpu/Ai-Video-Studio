name: Windows build

# Builds the packaged Windows application (EXE folder, portable ZIP, installer) and tests the
# packaged program itself with packaging/windows/test_packaged.ps1. Tag pushes (v*) publish a
# GitHub release with the artifacts.
on:
  push:
    branches: [claude/bold-goldberg-nhol0w]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test the packaged app
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            packaging/windows/constraints.txt

      - name: Install FFmpeg for the test suite (the build bundles its own pinned copy)
        shell: pwsh
        run: .github/scripts/install-ffmpeg.ps1

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          Get-Item "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" | Select-Object FullName

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt -r requirements-dev.txt -c packaging/windows/constraints.txt
          python -m pip freeze > pip-freeze.txt

      - name: Run the test suite (source)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -rs -p no:cacheprovider

      - name: Build EXE folder, portable ZIP and installer
        run: python packaging/build.py

      - name: Prepare test assets (public-domain face photo, speech sample)
        shell: bash
        run: |
          mkdir -p build/test-assets
          curl -fsSL -o build/test-assets/astronaut.png https://raw.githubusercontent.com/scikit-image/scikit-image/v0.19.3/skimage/data/astronaut.png
          echo "88431cd9653ccd539741b555fb0a46b61558b301d4110412b5bc28b5e3ea6cb5  build/test-assets/astronaut.png" | sha256sum -c -
          cp tests/fixtures/speech_en.flac build/test-assets/

      - name: Test the packaged application (no Python, no system FFmpeg on PATH)
        shell: pwsh
        run: |
          $version = (Get-Content dist/build-info.json | ConvertFrom-Json).version
          powershell -ExecutionPolicy Bypass -File packaging\windows\test_packaged.ps1 `
            -AppDir dist\AI-Video-Studio -Assets build\test-assets -WhisperModel tiny `
            -Zip "dist\AI-Video-Studio-$version-portable-win64.zip" `
            -Installer "dist\AI-Video-Studio-$version-setup-win64.exe" -Work "$env:RUNNER_TEMP\avs-packaged"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Size and contents summary
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          Get-Content dist/build-info.json
          Get-ChildItem dist -File | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-studio-windows
          path: |
            dist/*.zip
            dist/*-setup-win64.exe
            dist/SHA256SUMS.txt
            dist/build-info.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-test-reports
          path: |
            ${{ runner.temp }}/avs-packaged/reports
            ${{ runner.temp }}/avs-packaged/*.log
            ${{ runner.temp }}/avs-packaged/data/logs
            pip-freeze.txt
          if-no-files-found: ignore

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ai-video-studio-windows
          path: release
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" \
            --title "AI Video Studio ${GITHUB_REF_NAME}" --notes "Windows installer, portable ZIP and checksums. See CHANGELOG.md." \
            --prerelease
