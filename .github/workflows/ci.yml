name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      AVS_TEST_WHISPER_MODEL_DIR: ${{ github.workspace }}/.cache/whisper-tiny
      AVS_TEST_WHISPER_BN_MODEL_DIR: ${{ github.workspace }}/.cache/whisper-small
      AVS_REQUIRE_REAL_WHISPER: "1"
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install FFmpeg (Windows, Gyan build via Chocolatey)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install FFmpeg and Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libegl1 libgl1 libxkbcommon0 \
            libfontconfig1 libdbus-1-3 libglib2.0-0 fonts-dejavu-core fonts-freefont-ttf

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: |
            .cache/whisper-tiny
            .cache/whisper-small
          key: whisper-faster-tiny-small-v1

      - name: Download Whisper models (faster-whisper tiny + small)
        shell: bash
        run: |
          python -c "from huggingface_hub import snapshot_download as d; print(d('Systran/faster-whisper-tiny', local_dir='.cache/whisper-tiny'))"
          python -c "from huggingface_hub import snapshot_download as d; print(d('Systran/faster-whisper-small', local_dir='.cache/whisper-small'))"
          ls -la .cache/whisper-tiny .cache/whisper-small

      - name: Environment check
        run: python -m ai_video_studio.tools.check_env

      - name: Application smoke test (native Qt platform on Windows)
        if: ${{ !cancelled() }}
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Windows' && 'windows' || 'offscreen' }}
          AVS_DATA_DIR: ${{ runner.temp }}/avs-smoke
        run: python -m ai_video_studio --smoke-test

      - name: Application smoke test under pythonw.exe (no console, like run.bat)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          # PYTHONFAULTHANDLER needs a stderr; pythonw has none and would abort before any app code runs.
          $env:PYTHONFAULTHANDLER = $null
          $pyw = Join-Path (Split-Path (Get-Command python).Source) 'pythonw.exe'
          $env:AVS_DATA_DIR = Join-Path $env:RUNNER_TEMP 'avs-pythonw'
          $p = Start-Process -FilePath $pyw -ArgumentList '-m','ai_video_studio','--smoke-test' -WorkingDirectory $PWD -Wait -PassThru
          Write-Host "pythonw exit code: $($p.ExitCode)"
          $log = Join-Path $env:AVS_DATA_DIR 'logs\ai_video_studio.log'
          $crash = Join-Path $env:AVS_DATA_DIR 'startup_error.log'
          if (Test-Path $crash) { Get-Content $crash }
          if (Test-Path $log) { Get-Content $log -Tail 4 }
          if ($p.ExitCode -ne 0 -or -not (Select-String -Path $log -Pattern 'Smoke test passed' -Quiet)) { throw "pythonw smoke test failed" }
          # Progress-bar output under pythonw (what Whisper model downloads do):
          $marker = Join-Path $env:RUNNER_TEMP 'pythonw-tqdm-ok.txt'
          $code = "from ai_video_studio.app import ensure_std_streams; ensure_std_streams(); from tqdm import tqdm; list(tqdm(range(5))); open(r'$marker','w').write('ok')"
          $p = Start-Process -FilePath $pyw -ArgumentList '-c', "`"$code`"" -WorkingDirectory $PWD -Wait -PassThru
          if (-not (Test-Path $marker)) { throw "tqdm output under pythonw crashed (exit $($p.ExitCode))" }
          Write-Host "tqdm under pythonw: OK"

      - name: Run test suite
        if: ${{ !cancelled() }}
        run: python -m pytest -v -rs -s --durations=15 --junitxml=test-results.xml

      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            test-results.xml
            ${{ runner.temp }}/avs-*/logs/*.log
          if-no-files-found: ignore

  windows-scripts:
    name: Windows setup/run scripts
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress
      - name: setup.bat --dev (creates .venv, installs, runs check_env)
        shell: cmd
        run: call scripts\windows\setup.bat --dev
      - name: run.bat --console --smoke-test
        shell: cmd
        env:
          AVS_DATA_DIR: ${{ runner.temp }}\avs-runbat
        run: call scripts\windows\run.bat --console --smoke-test
      - name: run_tests.bat (unit tests)
        shell: cmd
        env:
          QT_QPA_PLATFORM: offscreen
        run: call scripts\windows\run_tests.bat tests\unit -q
